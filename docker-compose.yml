services:
  postgres:
    image: postgres:16
    container_name: backend-challenge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backend_challenge}
      POSTGRES_USER: ${POSTGRES_USER:-backend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backend}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-backend} -d ${POSTGRES_DB:-backend_challenge}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  ministack:
    image: ministackorg/ministack:latest
    container_name: backend-challenge-ministack
    restart: unless-stopped
    environment:
      MINISTACK_REGION: ${AWS_REGION:-us-east-1}
      MINISTACK_ACCOUNT_ID: "000000000000"
      PERSIST_STATE: "1"
      STATE_DIR: /var/lib/ministack-state
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ministack_data:/var/lib/ministack-state
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health', timeout=2).read()\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  sqs-init:
    build:
      context: ./infra/ministack
      dockerfile: Dockerfile
    container_name: backend-challenge-sqs-init
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://ministack:4566}
    depends_on:
      ministack:
        condition: service_healthy

  keycloak:
    build:
      context: ./infra/keycloak
      dockerfile: Dockerfile
    container_name: backend-challenge-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --hostname=http://keycloak:8080
      - --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: backend-challenge-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_PORT:-16686}:16686"
    volumes:
      - jaeger_data:/badger

  otel-collector:
    build:
      context: ./infra/otel-collector
      dockerfile: Dockerfile
    container_name: backend-challenge-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      jaeger:
        condition: service_started

  prometheus:
    build:
      context: ./infra/prometheus
      dockerfile: Dockerfile
    container_name: backend-challenge-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      otel-collector:
        condition: service_started

  grafana:
    build:
      context: ./infra/grafana
      dockerfile: Dockerfile
    container_name: backend-challenge-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-challenge-api
    restart: unless-stopped
    environment:
      HTTP_PORT: ${HTTP_PORT:-8080}

      DATABASE_URL: ${DATABASE_URL:-postgres://backend:backend@postgres:5432/backend_challenge}

      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://ministack:4566}

      SQS_QUEUE_URL: ${SQS_QUEUE_URL:-http://ministack:4566/000000000000/wager-transactions.fifo}
      SQS_EVENTS_QUEUE_URL: ${SQS_EVENTS_QUEUE_URL:-http://ministack:4566/000000000000/wager-events.fifo}
      SQS_DLQ_URL: ${SQS_DLQ_URL:-http://ministack:4566/000000000000/wager-transactions-dlq.fifo}

      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://keycloak:8080/realms/backend-challenge}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-backend-api}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-backend-api}

      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-backend-challenge-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local}

    ports:
      - "${HTTP_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy
      sqs-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  postgres_data:
  ministack_data:
  prometheus_data:
  jaeger_data:
  grafana_data: